name: ci

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Fast static checks run together; they do not need a macOS runner.
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy (must be clean)
        run: go mod tidy -diff

      - name: compile acceptance suite
        run: go test -tags acceptance -run '^$' ./test/acceptance

      - name: compile release suite
        run: go test -tags 'acceptance release' -run '^$' ./test/acceptance

  # Cross-build targets in parallel. Native tests run in the unit/acceptance
  # matrices below.
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o "/tmp/nullkeyd-${GOOS}-${GOARCH}" ./cmd/nullkeyd

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        run: go test -race -count=1 ./...

  acceptance:
    name: acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: black-box acceptance (strict)
        run: NULLKEY_ACCEPTANCE_STRICT=1 go test -tags acceptance -count=1 -timeout 15m ./test/acceptance

      - name: release suite compiles
        run: go test -tags 'acceptance release' -run '^$' ./test/acceptance

  coverage:
    name: coverage (>=90%)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test coverage gate
        run: make coverage

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: ignore

  # The GUI ships from this repository; keep its static analysis and widget
  # tests in the same gate as the daemon.
  gui:
    name: gui (analyze + test)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build daemon for GUI integration tests
        run: go build -o "$RUNNER_TEMP/nullkeyd-gui-test" ./cmd/nullkeyd

      - name: flutter pub get
        working-directory: apps/nullkey-gui
        run: flutter pub get

      - name: flutter analyze
        working-directory: apps/nullkey-gui
        run: flutter analyze

      - name: flutter test
        working-directory: apps/nullkey-gui
        env:
          NULLKEY_TEST_DAEMON: ${{ runner.temp }}/nullkeyd-gui-test
        run: flutter test

      - name: build GUI and check native startup
        run: |
          cd apps/nullkey-gui
          flutter build macos --release
          cd ../..
          ./scripts/gui-smoke.sh apps/nullkey-gui/build/macos/Build/Products/Release/Nullkey.app
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: routes match api/openapi.yaml
        run: go test -count=1 -v ./internal/contract
