<style>
:root{color-scheme:dark;--bg:#101312;--panel:#191d1b;--line:#2a302d;--muted:#8d9992;--text:#e7ede8;--green:#b8ed92;--amber:#edc481}*{box-sizing:border-box}body{margin:0;background:#080b09;color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:#222824;color:var(--text);padding:9px 13px}button:hover{border-color:#69786c}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:3px}.primary{background:var(--green);color:#172111;border:0;font-weight:600}.quiet{background:transparent}.muted{color:var(--muted)}small{color:var(--muted);line-height:1.6}.app{height:100vh;min-height:650px;display:grid;grid-template-columns:218px 1fr;grid-template-rows:44px 1fr 32px}.titlebar{grid-column:1/-1;display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 18px;background:#191d1b;gap:8px}.dot{height:11px;width:11px;border-radius:50%;background:#fe6058}.dot:nth-child(2){background:#febd2e}.dot:nth-child(3){background:#28c840}.windowtitle{flex:1;text-align:center;font-size:12px;color:var(--muted);padding-right:50px}aside{background:#161a18;border-right:1px solid var(--line);padding:25px 14px;display:flex;flex-direction:column}.logo{font-size:23px;font-weight:650;letter-spacing:-1px;padding:0 12px 28px}.logo b{color:var(--green);margin-right:9px}.section{font-size:10px;letter-spacing:1.5px;color:#78867d;padding:20px 12px 10px}nav{display:grid;gap:5px}nav button{text-align:left;background:none;border-color:transparent;color:#9daaa1;padding:11px 13px}nav button.active{background:#293329;color:var(--green)}nav button span{display:inline-block;width:25px}.sidefoot{margin-top:auto;padding:15px 12px 0;border-top:1px solid var(--line)}main{background:var(--bg);overflow:auto;min-width:0}.top{height:80px;border-bottom:1px solid var(--line);padding:0 30px;display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:20px;font-weight:550;margin:0 0 6px}h2{font-size:22px;font-weight:550;margin:0 0 12px}h3{font-size:15px;font-weight:550;margin:0 0 9px}p{line-height:1.7}.content{padding:30px;max-width:1200px;margin:auto}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.actions{display:flex;gap:8px;align-items:center}.pill{font-size:11px;border:1px solid #3b4a3a;border-radius:20px;color:var(--green);padding:5px 9px;white-space:nowrap}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:23px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.eyebrow{font-size:11px;color:var(--green);letter-spacing:1.7px;margin-bottom:14px}.big{font-size:34px;letter-spacing:-1px;font-weight:550;line-height:1.3;margin:0 0 16px}.hero{padding:30px;background:linear-gradient(120deg,#242e21,#191d1b)}.hero p{color:#a7b5a9;max-width:560px}.terminal-layout{display:grid;grid-template-columns:minmax(0,1fr) 255px;min-height:calc(100vh - 156px)}.terminal{padding:25px 28px;font:13px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;min-width:0}.termhead{padding:15px 18px;border:1px solid #3a443d;border-radius:10px;max-width:540px;margin-bottom:28px}.termhead strong{font-size:16px}.termtext{color:#c2ccc4;white-space:pre-wrap;overflow-wrap:anywhere}.green{color:var(--green)}.prompt{display:flex;gap:12px;border-top:1px solid var(--line);padding-top:17px;margin-top:30px}.prompt input{flex:1;min-width:0;background:transparent;color:var(--text);border:0;outline:none}.inspector{border-left:1px solid var(--line);padding:25px 20px;background:#151916}.kv{display:flex;justify-content:space-between;font-size:12px;margin:18px 0;color:var(--muted)}.kv b{color:#d2dcd3;font-weight:400}.inspector hr{border:0;border-top:1px solid var(--line);margin:28px 0}.notice{margin:18px 28px 0;padding:15px 18px;border:1px solid #705b35;background:#30291c;border-radius:8px;color:var(--amber);display:flex;align-items:center;justify-content:space-between;gap:15px}.footer{grid-column:1/-1;background:#191d1b;border-top:1px solid var(--line);padding:7px 18px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.listrow{padding:18px 0;border-top:1px solid var(--line)}.listrow:first-child{border:0}.steps{display:flex;gap:25px;margin-bottom:35px;font-size:12px;color:var(--muted)}.steps .current{color:var(--green)}label{display:block;color:#b4c0b6;font-size:12px;margin:20px 0 8px}input.field,select{width:100%;background:#111613;border:1px solid #39433b;border-radius:8px;padding:12px;color:var(--text)}.narrow{max-width:650px;margin:45px auto}.option{display:flex;align-items:center;gap:14px;padding:18px;background:#202820;border:1px solid #495c43;border-radius:9px;margin:18px 0}.option p{margin:4px 0;font-size:12px;color:var(--muted)}.demo{position:fixed;right:16px;bottom:42px;background:#242b25;border:1px solid #465143;padding:10px 13px;border-radius:9px;box-shadow:0 8px 30px #0005;z-index:3;font-size:11px}.demo select{width:auto;padding:4px;font-size:11px;margin-left:8px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#33442c;padding:14px 24px;border:1px solid #718965;border-radius:9px;z-index:6}.fileview{display:grid;grid-template-columns:180px 1fr;gap:20px}pre{overflow:auto;color:#b9d7a9;line-height:1.8;margin:0}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.empty h2{color:var(--text)}@media(max-width:1000px){.app{grid-template-columns:180px 1fr}.terminal-layout{grid-template-columns:1fr}.inspector{display:none}.grid{grid-template-columns:1fr}.content{padding:22px}.top{padding:0 22px}}@media(max-width:650px){.app{grid-template-columns:68px 1fr}aside{padding:20px 6px}.logo{font-size:0;padding:0 10px 25px}.logo b{font-size:24px}nav button{font-size:0}nav button span{font-size:18px;width:auto}.section,.sidefoot{display:none}.top{height:auto;min-height:80px;flex-wrap:wrap;padding:15px}.content{padding:16px}.terminal{padding:20px 15px}.big{font-size:27px}.demo{max-width:calc(100vw - 85px)}.fileview{grid-template-columns:1fr}.footer span:last-child{display:none}}
</style>
<div class="app"><div class="titlebar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><div class="windowtitle">Nullkey — Agent workspace</div></div><aside><div class="logo"><b>⌘</b>nullkey<span class="green">.</span></div><div class="section">WORKSPACE</div><nav id="nav"></nav><div class="section">MANAGE</div><nav id="manage"></nav><div class="sidefoot"><small><span class="green">●</span> 本地服务已连接<br>macOS · Native runtime</small></div></aside><main id="main"></main><div class="footer"><span>● 交互原型 · 所有数据与终端输出均为模拟</span><span>Nullkey / GUI exploration 01</span></div></div>
<div class="demo">体验场景<select id="scenario" aria-label="切换体验场景"><option value="normal">正常工作</option><option value="first">首次使用</option><option value="auth">授权过期</option><option value="network">网络被阻止</option><option value="locked">工作区被占用</option><option value="failed">沙箱启动失败</option><option value="disconnected">终端连接断开</option></select></div>
<script>
const $=s=>document.querySelector(s);const state={page:'Terminal',scenario:'normal',running:true,step:0,connected:true,installed:true,name:'nullkey',network:'filtered',lines:[],audit:['沙箱已启动 · Codex / filtered','访问令牌已签发 · 当前沙箱有效'],busy:false};
const pages=[['Home','⌂','概览'],['Terminal','›_','终端'],['Artifacts','▤','产物'],['Services','◈','服务']];const managers=[['Workspaces','▦','工作区'],['Credentials','⚿','凭证'],['MCP','⌘','MCP'],['Audit','◷','活动记录'],['Settings','⚙','设置']];
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2800)}
function nav(){for(const [id,items]of [['nav',pages],['manage',managers]])$('#'+id).innerHTML=items.map(([key,icon,label])=>`<button data-page="${key}" class="${state.page===key?'active':''}"><span>${icon}</span>${label}</button>`).join('')}
function head(title,sub,action=''){return `<div class="top"><div><h1>${title}</h1><small>${sub}</small></div><div class="actions">${action}</div></div>`}function btn(text,act,cls=''){return `<button class="${cls}" data-act="${act}">${text}</button>`}function status(){return state.running?'运行中':'已停止'}
function onboarding(){const texts=['连接你的 Agent','准备 Codex','选择工作区'];return head('开始使用','三步准备好你的第一个工作环境')+`<div class="content narrow"><div class="steps">${texts.map((s,i)=>`<span class="${i===state.step?'current':''}">${i+1} / ${s}</span>`).join('')}</div><div class="eyebrow">YOUR LOCAL AGENT SPACE</div><h2 class="big">${texts[state.step]}</h2>`+(state.step===0?`<p class="muted">在宿主浏览器中授权，凭证保存在本机 Keychain。Agent 通过 Nullkey 使用连接。</p><div class="option"><strong>◎</strong><div><h3>Codex / OpenAI</h3><p>${state.connected?'已连接 · personal':'使用你的账号继续'}</p></div></div>${btn(state.connected?'已连接，继续':'连接 Codex','oauth','primary')}<p><small>此原型模拟授权结果，不会打开真实登录或接收凭证。</small></p>`:state.step===1?`<p class="muted">Nullkey 在宿主安装固定版本的 Codex，工作环境只读使用。</p><div class="card row"><div><h3>Codex CLI</h3><small>${state.installed?'已安装 · 版本由团队固定':'尚未安装 · 安装前校验文件完整性'}</small></div><span class="pill">Native</span></div>${btn(state.installed?'继续':'安装 Codex','install','primary')}`:`<p class="muted">为项目取一个名字。代码和会话会在停止后保留。</p><label for="wsname">工作区名称</label><input class="field" id="wsname" value="${esc(state.name)}"><label for="net">网络模式</label><select id="net"><option value="filtered">Filtered · 仅允许批准的目标（默认）</option><option value="offline">Offline · 仅模型与工具网关</option><option value="open">Open · 通过代理访问任意目标</option></select><p id="networkhint"><small>可安装依赖、读取公开文档；认证请求通过网关。</small></p><br>${btn(state.busy?'正在启动…':'启动工作区','launch','primary')}`)+`</div>`}
function terminal(){let alerts={auth:['Codex 授权已过期。重新连接后可继续当前会话。','重新连接','reauth'],network:['已阻止访问 example.invalid。项目文件和终端仍可使用。','查看活动','audit'],failed:['沙箱未能启动。隔离策略加载失败，没有启动 Agent。','重试启动','retry'],disconnected:['终端连接已断开。沙箱仍在运行，正在保留当前画面。','重新连接','reconnect']};let a=alerts[state.scenario];return head(esc(state.name),`Codex · ${state.network} · 会话 ${state.running?'进行中':'已保留'}`,`<span class="pill">${status()}</span>${btn(state.running?'停止沙箱':'继续工作',state.running?'stop':'resume')}`)+(a?`<div class="notice" role="status"><span>${a[0]}</span>${btn(a[1],a[2],'quiet')}</div>`:'')+`<div class="terminal-layout"><div class="terminal"><div class="termhead"><strong>›_ Codex</strong><br><span class="muted">Nullkey managed session</span><br><br>directory: <span class="green">${esc(state.name)}</span><br>provider: <span class="green">Nullkey Gateway</span></div><div class="muted">以下为交互示意，不是真实 PTY。</div><br><div class="termtext">› 读一下这个项目，告诉我从哪里开始。<br><br><span class="green">•</span> 已读取 README 和项目目录。<br>  这是一个桌面 Agent 工作台的设计项目。<br>  可以先从 Terminal、凭证连接和工作区流程开始。<br><br><span class="muted">  3 files explored · session preserved</span></div><div id="output" class="termtext">${state.lines.map(esc).join('<br>')}</div><form class="prompt" id="prompt"><span class="green">›</span><input aria-label="模拟终端输入" placeholder="${state.running?'输入一条消息，按 Enter 体验':'会话已停止，点击继续工作'}" ${!state.running||['auth','failed','disconnected'].includes(state.scenario)?'disabled':''}><button type="submit" ${!state.running?'disabled':''}>↵</button></form><p><small>真实产品中，此区域完整嵌入 harness 自己的 TUI。</small></p></div><div class="inspector"><div class="eyebrow">SESSION</div><h3>工作环境</h3><div class="kv">Agent<b>Codex CLI</b></div><div class="kv">Runtime<b>Native</b></div><div class="kv">Network<b>${state.network}</b></div><div class="kv">Workspace<b>读写 · 独占</b></div><hr><h3>凭证留在本机</h3><p><small>Agent 通过临时访问令牌调用网关。停止沙箱后令牌立即失效。</small></p><hr><h3>项目工具</h3><div class="kv">GitHub MCP<b class="green">已连接</b></div>${btn('查看产物 →','artifacts','quiet')}<hr><small>代码与会话默认保留。<br>停止沙箱后可以继续工作。</small></div></div>`}
function home(){return head('你的工作台','让 Agent 开始工作，凭证留在本机',btn('新建工作区','new','primary'))+`<div class="content"><div class="card hero"><div class="eyebrow">LOCAL FIRST. KEYS STAY HOME.</div><h2 class="big">专注项目，<br>安心连接你的 Agent。</h2><p>独立工作环境、持久会话，以及留在本机的凭证。<br>从上次停下的地方继续。</p>${btn('继续 '+esc(state.name),'terminal','primary')}</div><div class="row"><h3>最近工作区</h3><small>1 个工作区</small></div><br><div class="card row"><div><h3>${esc(state.name)}</h3><small>Codex · ${state.network} · 会话已保留</small></div>${btn('打开 →','terminal')}</div><div class="grid"><div class="card"><h3>连接准备就绪</h3><p class="muted">Codex / OpenAI · personal</p>${btn('管理凭证','credentials','quiet')}</div><div class="card"><h3>你的项目工具</h3><p class="muted">GitHub 已连接，可以搜索与读取仓库。</p>${btn('管理 MCP','mcp','quiet')}</div></div></div>`}
function credentials(){return head('凭证','集中管理宿主侧连接；只显示连接状态与指纹')+`<div class="content"><div class="card"><div class="row"><div><div class="eyebrow">MODEL PROVIDER</div><h3>Codex / OpenAI</h3><small>personal · OAuth · 指纹末四位 ab34（模拟）</small></div><span class="pill">${state.connected?'已连接':'需要连接'}</span></div><p class="muted">授权信息保存在 macOS Keychain，Agent 通过网关使用。</p><div class="actions">${btn(state.connected?'测试连接':'重新连接',state.connected?'test':'connect')}${btn('撤销连接','revoke','quiet')}</div></div><div class="card"><h3>API key 连接</h3><p class="muted">正式界面仅在宿主端接收密钥，保存后不回显。</p><small>本轮原型不接收真实密钥。OAuth 流程可通过“首次使用”体验。</small></div></div>`}
function workspaces(){return head('工作区','项目和会话默认保留',btn('新建工作区','new','primary'))+`<div class="content">${state.scenario==='locked'?'<div class="notice">此工作区正在被另一个沙箱写入。请选择其他工作区，或等待它停止。</div><br>':''}<div class="card row"><div><h3>${esc(state.name)}</h3><small>Nullkey 管理目录 · Codex state · 读写独占</small><p class="muted">${state.scenario==='locked'?'被 sbx_other 占用':status()+' · 代码与会话已保留'}</p></div>${state.scenario==='locked'?btn('使用其他工作区','new'):btn('打开终端','terminal','primary')}</div><small>共享只读工作区的交互待与后端确认；此版本不提供绕过独占锁的操作。</small></div>`}
function artifacts(){return head('产物',esc(state.name)+' · 只读审查 · 示例文件')+`<div class="content"><div class="card fileview"><div><h3>文件</h3><p class="green">README.md</p><p class="muted">docs/</p><p class="muted">api/</p></div><div><h3>README.md <small>· 示例预览</small></h3><br><pre># Nullkey\n\n桌面级 Agent 安全沙箱。\n凭证留在宿主 Keychain。\n\nStatus: design phase</pre><br><small>当前显示静态样例。正式版提供文件树、图片预览与 Git diff。</small></div></div></div>`}
function services(){return head('服务','在本机打开工作环境中的 WebUI 与预览')+`<div class="empty"><h2>还没有运行中的服务</h2><p>当 Agent 启动并注册预览服务后，它会出现在这里。</p><small>只展示已声明的服务，不扫描本机端口。</small><p>${btn('返回终端','terminal')}</p></div>`}
function mcp(){return head('MCP','连接项目所需的工具')+`<div class="content"><div class="card row"><div><h3>GitHub</h3><small>宿主侧 · 示例连接 · 搜索仓库 / 读取文件</small></div><span class="pill">已连接</span></div><div class="card row"><div><h3>Filesystem</h3><small>沙箱侧 · 仅当前 workspace</small></div><span class="pill">可用</span></div><small>工具列表为设计示例，实际能力以后端返回值为准。</small></div>`}
function audit(){return head('活动记录','关键环境事件；不记录请求正文与凭证')+`<div class="content"><div class="card">${state.audit.map((s,i)=>`<div class="listrow row"><span>${esc(s)}</span><small>事件 ${state.audit.length-i}</small></div>`).join('')}</div></div>`}
function settings(){return head('设置','工作台默认行为')+`<div class="content"><div class="card"><div class="listrow row"><div><h3>网络默认值</h3><small>启动工作区时可选择</small></div><span class="pill">Filtered</span></div><div class="listrow row"><div><h3>状态持久化</h3><small>停止后保留代码、会话与缓存</small></div><span class="green">开启</span></div><div class="listrow row"><div><h3>Desktop</h3><small>当前能力集未提供桌面后端</small></div><button disabled>不可用</button></div></div><small>本轮为只读设置示意。默认策略保存接口需与后端确认。</small></div>`}
function render(){nav();const views={Home:home,Terminal:terminal,Credentials:credentials,Workspaces:workspaces,Artifacts:artifacts,Services:services,MCP:mcp,Audit:audit,Settings:settings,Setup:onboarding};$('#main').innerHTML=views[state.page]();$('#scenario').value=state.scenario;if($('#net'))$('#net').value=state.network}
function go(p){state.page=p;render()}function clearIssue(){state.scenario='normal';render()}
document.addEventListener('click',e=>{let page=e.target.closest('[data-page]');if(page){go(page.dataset.page);return}let el=e.target.closest('[data-act]');if(!el||el.disabled)return;let a=el.dataset.act;if(['terminal','credentials','mcp','audit','artifacts'].includes(a)){go({terminal:'Terminal',credentials:'Credentials',mcp:'MCP',audit:'Audit',artifacts:'Artifacts'}[a]);return}if(a==='new'){state.step=2;go('Setup')}if(a==='oauth'){if(state.connected){state.step=1;render()}else{state.connected=true;toast('模拟授权成功 · 凭证保存在宿主');render()}}if(a==='install'){if(state.installed){state.step=2;render()}else{el.disabled=true;el.textContent='校验并安装中…';setTimeout(()=>{state.installed=true;render();toast('模拟安装完成')},1000)}}if(a==='launch'){let name=$('#wsname').value.trim();if(!name){toast('请填写工作区名称');$('#wsname').focus();return}if(!state.connected){state.step=0;render();return}state.name=name;state.network=$('#net').value;state.busy=true;render();setTimeout(()=>{state.busy=false;state.running=true;state.scenario='normal';state.audit.unshift('沙箱已启动 · '+state.network);go('Terminal')},900)}if(a==='stop'){state.running=false;state.audit.unshift('沙箱已停止 · 访问令牌已撤销');render();toast('已停止，代码与会话已保留')}if(a==='resume'||a==='retry'){state.running=true;state.audit.unshift('沙箱已重新启动 · 已轮换访问令牌');clearIssue()}if(a==='reauth'||a==='connect'){state.connected=true;state.audit.unshift('Codex 已重新授权（模拟）');clearIssue();toast('模拟连接成功，可继续当前会话')}if(a==='reconnect'){clearIssue();toast('终端连接已恢复（模拟）')}if(a==='test')toast('模拟连接正常');if(a==='revoke'){if(confirm('撤销 Codex 连接？使用该凭证的所有沙箱将无法继续模型调用，项目文件保留。')){state.connected=false;state.scenario='auth';state.audit.unshift('Codex 连接已撤销');render();toast('连接已撤销')}}});
document.addEventListener('submit',e=>{if(e.target.id!=='prompt')return;e.preventDefault();let input=e.target.querySelector('input');if(input.disabled||!state.running)return;let value=input.value.trim();if(!value)return;state.lines.push('\n› '+value,'• 这是模拟响应。输入不会发送给模型，也不会执行命令。');render();$('#prompt input').focus()});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){state.scenario=e.target.value;state.running=!['failed','first'].includes(state.scenario);state.connected=!['auth','first'].includes(state.scenario);if(state.scenario==='first'){state.step=0;state.installed=false;go('Setup')}else if(state.scenario==='locked')go('Workspaces');else{if(state.scenario==='network')state.audit.unshift('网络已阻止 · example.invalid · not_allowlisted');go('Terminal')}}if(e.target.id==='net'){$('#networkhint').innerHTML='<small>'+({filtered:'可安装依赖、读取公开文档；认证请求通过网关。',offline:'只允许网关请求。安装依赖和访问公开网站将不可用。',open:'允许通过代理访问任意目标，会扩大项目数据外发风险。'})[e.target.value]+'</small>'}});render();
</script>
</html>
